<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="app-header">
      <div class="header-top">
        <h1>待办清单</h1>
        <label class="theme-toggle" for="theme-toggle">
          <span>暗色</span>
          <input id="theme-toggle" type="checkbox" role="switch" aria-label="切换深色模式" />
        </label>
      </div>
      <p class="app-stats" id="app-stats"></p>
    </div>

    <div class="app-body">
      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="输入待办事项，按 Enter 添加…" aria-label="Todo 输入框" />
        <button type="submit">添加</button>
      </form>

      <div class="filter-tabs" id="filter-tabs" role="tablist" aria-label="筛选待办事项">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">全部</button>
        <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">待完成</button>
        <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">已完成</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
